[project]
name = "mcp-chess-example"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    #    "mcp[cli]>=2.2.0",
    "mcp[cli]<2",
    "openai>=3.17.0",
    "requests>=2.34.2",
]

[project.scripts]
chess = "chess.server:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
